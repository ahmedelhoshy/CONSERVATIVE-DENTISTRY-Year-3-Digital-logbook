<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lecture 5 · Dental Cariology (3) · Quick Quiz</title><style>:root{--bg:#F6F4EF;--card:#fff;--ink:#1C2B30;--mute:#5B6B70;--teal:#0E3F4A;--gold:#C8862A;--ok:#2E7D4F;--bad:#A23B2A;--line:#DCD8CE}
@media (prefers-color-scheme:dark){:root{--bg:#10191C;--card:#18252A;--ink:#E8EEEC;--mute:#9DB0B3;--teal:#7FC3CF;--gold:#E2B868;--ok:#6CC08F;--bad:#E07A68;--line:#2A3A40}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}h1{font:700 26px Georgia,serif;color:var(--teal);margin:0 0 4px}.sub{color:var(--mute);margin:0 0 16px}
.bar{display:flex;justify-content:space-between;font-size:14px;color:var(--mute);margin-bottom:8px}.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}.prog i{display:block;height:100%;background:var(--gold);transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}.case{font:600 13px system-ui;letter-spacing:1px;text-transform:uppercase;color:var(--gold)}
.q{margin:6px 0 14px;font-size:17px}.ar{direction:rtl;color:var(--mute);font-size:15px;margin:-6px 0 14px}
.opts{display:grid;gap:10px}button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:12px 14px;text-align:start;font-weight:600}
button:disabled{cursor:default;opacity:1}button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}button.used{opacity:.35}
.fb{margin-top:14px;padding:12px;border-radius:10px;display:none}.fb.ok{display:block;background:color-mix(in srgb,var(--ok) 14%,transparent)}.fb.bad{display:block;background:color-mix(in srgb,var(--bad) 14%,transparent)}
.next{margin-top:14px;width:100%;background:var(--teal);color:var(--bg);border:0;display:none;text-align:center}.end{text-align:center}.big{font:700 54px Georgia,serif;color:var(--teal)}
ol.seq{margin:0 0 12px;padding-inline-start:22px}ol.seq li{margin:4px 0}ol.seq li.bad{color:var(--bad)}ol.seq li.ok{color:var(--ok)}
.ref{margin-top:18px;font-size:14px;color:var(--mute)}.ref b{color:var(--ink)}</style></head><body><main>
<h1>Lecture 5 · Dental Cariology (3) · Quick Quiz</h1><p class="sub">8 random questions from the Etiology of Dental Caries question bank · new questions every play</p><div class="bar"><span id="count"></span><span id="time">⏱ 0:00</span></div><div class="prog"><i id="pg" style="width:0"></i></div>
<div class="card" id="box"></div><div class="ref" id="ref" hidden><b>Summary:</b> This quiz draws 8 of the 16 questions in the Lecture 5 question bank each time you play.</div></main><script>const ALL=[{"t": "Etiology of Dental Caries", "q": "Dental caries is best described as:", "o": ["A purely genetic disease", "A multifactorial, infectious, microbiological disease", "A disease caused by sugar alone", "A developmental defect of enamel"], "a": "A multifactorial, infectious, microbiological disease", "why": "Answer: A multifactorial, infectious, microbiological disease."}, {"t": "Etiology of Dental Caries", "q": "The four main factors that must interact for caries to develop are:", "o": ["Host (tooth), microorganisms, diet (substrate) and time", "Saliva, fluoride, sugar and age", "Bacteria, calculus, protein and time", "Tooth, gingiva, saliva and fluoride"], "a": "Host (tooth), microorganisms, diet (substrate) and time", "why": "Answer: Host (tooth), microorganisms, diet (substrate) and time."}, {"t": "Etiology of Dental Caries", "q": "Which fissure type is most retentive and caries-susceptible?", "o": ["V-type", "U-type", "I- and K-types (deep and narrow)", "All types are the same"], "a": "I- and K-types (deep and narrow)", "why": "Answer: I- and K-types (deep and narrow)."}, {"t": "Etiology of Dental Caries", "q": "Which is NOT a function of saliva?", "o": ["Buffering", "Clearance", "Remineralization", "Acid production"], "a": "Acid production", "why": "Answer: Acid production."}, {"t": "Etiology of Dental Caries", "q": "Causes of hyposalivation (reduced salivary flow) include:", "o": ["Drugs, radiation and salivary gland disorders", "Fluoride toothpaste", "Chewing sugar-free gum", "Regular brushing"], "a": "Drugs, radiation and salivary gland disorders", "why": "Answer: Drugs, radiation and salivary gland disorders."}, {"t": "Etiology of Dental Caries", "q": "The microorganism mainly responsible for caries initiation is:", "o": ["Lactobacillus", "Streptococcus mutans", "Actinomyces", "Candida albicans"], "a": "Streptococcus mutans", "why": "Answer: Streptococcus mutans."}, {"t": "Etiology of Dental Caries", "q": "Lactobacillus is mainly associated with:", "o": ["Caries initiation", "Caries progression", "Gingivitis only", "Remineralization"], "a": "Caries progression", "why": "Answer: Caries progression."}, {"t": "Etiology of Dental Caries", "q": "S. mutans is described as ______, while lactobacillus is ______.", "o": ["Aciduric / acidogenic", "Acidogenic / aciduric", "Alkaline / acidic", "Aerobic / anaerobic"], "a": "Acidogenic / aciduric", "why": "Answer: Acidogenic / aciduric."}, {"t": "Etiology of Dental Caries", "q": "Dental plaque (biofilm) is a microbial community embedded in a matrix of polymers mainly:", "o": ["Glucan from bacteria and saliva", "Calcium phosphate", "Collagen", "Keratin"], "a": "Glucan from bacteria and saliva", "why": "Answer: Glucan from bacteria and saliva."}, {"t": "Etiology of Dental Caries", "q": "On the Stephan curve, after a sucrose rinse plaque pH drops below the critical level of about:", "o": ["7.0", "6.5", "5.5", "3.0"], "a": "5.5", "why": "Answer: 5.5."}, {"t": "Etiology of Dental Caries", "q": "Regarding diet, the factors that affect cariogenicity include:", "o": ["Nature, frequency and consistency of food", "Colour of food only", "Temperature of food only", "Price of food"], "a": "Nature, frequency and consistency of food", "why": "Answer: Nature, frequency and consistency of food."}, {"t": "Etiology of Dental Caries", "q": "The first clinically visible stage of the caries process before cavitation is the:", "o": ["White spot", "Dentin lesion", "Pulpal lesion", "Restoration"], "a": "White spot", "why": "Answer: White spot."}, {"t": "Etiology of Dental Caries", "q": "The non-specific plaque hypothesis states that caries is caused by:", "o": ["A few specific bacteria", "The overall activity of the total plaque microflora", "A shift in the ecological balance", "Saliva alone"], "a": "The overall activity of the total plaque microflora", "why": "Answer: The overall activity of the total plaque microflora."}, {"t": "Etiology of Dental Caries", "q": "According to the specific plaque hypothesis:", "o": ["All plaque should be removed mechanically", "Only a few organisms are actively involved, so preventive measures can target them", "Sugar restriction alone is enough", "Caries is not bacterial"], "a": "Only a few organisms are actively involved, so preventive measures can target them", "why": "Answer: Only a few organisms are actively involved, so preventive measures can target them."}, {"t": "Etiology of Dental Caries", "q": "According to the ecological plaque hypothesis, caries control needs:", "o": ["Antibiotics only", "Both mechanical cleaning and restriction of sugar intake", "Fluoride only", "Extraction of affected teeth"], "a": "Both mechanical cleaning and restriction of sugar intake", "why": "Answer: Both mechanical cleaning and restriction of sugar intake."}, {"t": "Etiology of Dental Caries", "q": "In the caries balance model, protective factors include:", "o": ["Saliva, antimicrobials, fluorides and an effective diet", "Bacteria and frequent sugar intake", "Absence of saliva", "Poor oral hygiene"], "a": "Saliva, antimicrobials, fluorides and an effective diet", "why": "Answer: Saliva, antimicrobials, fluorides and an effective diet."}];const PICK=8;let G=ALL.slice().sort(()=>Math.random()-.5).slice(0,PICK);
const $=(id)=>document.getElementById(id);let i=0,score=0,max=0,t0=Date.now(),tm;
const sh=(a)=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
function tick(){const s=Math.floor((Date.now()-t0)/1000);$('time').textContent='⏱ '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function head(){$('count').textContent='Round '+(i+1)+' of '+G.length+' · score '+score;$('pg').style.width=(i/G.length*100)+'%'}
function nextBtn(){$('nx').style.display='block';$('nx').onclick=()=>{i++;i<G.length?show():end()}}
function show(){const c=G[i];head();let h='<div class="case">Round '+(i+1)+(c.t?' · '+c.t:'')+'</div><p class="q">'+c.q+'</p>'+(c.ar?'<p class="ar">'+c.ar+'</p>':'');
if(c.order){h+='<ol class="seq" id="seq"></ol><div class="opts" id="op">'+sh(c.order.map((s,k)=>[s,k])).map(([s,k])=>'<button data-k="'+k+'">'+s+'</button>').join('')+'</div>'}
else h+='<div class="opts">'+(c.keep?c.o:sh(c.o)).map(o=>'<button data-o="'+o.replace(/"/g,'&quot;')+'">'+o+'</button>').join('')+'</div>';
h+='<div class="fb" id="fb"></div><button class="next" id="nx">'+(i<G.length-1?'Next →':'See my score')+'</button>';$('box').innerHTML=h;
if(c.order){max+=c.order.length;let picked=[];document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{if(b.disabled)return;b.disabled=true;b.classList.add('used');picked.push(+b.dataset.k);
const li=document.createElement('li');li.textContent=c.order[+b.dataset.k];$('seq').appendChild(li);
if(picked.length===c.order.length){let ok=0;[...$('seq').children].forEach((x,n)=>{const g=picked[n]===n;if(g)ok++;x.className=g?'ok':'bad'});score+=ok;head();
const f=$('fb');f.className='fb '+(ok===c.order.length?'ok':'bad');f.innerHTML='<b>'+ok+' of '+c.order.length+' in the right place.</b> Correct order:<ol class="seq">'+c.order.map(s=>'<li>'+s+'</li>').join('')+'</ol>'+(c.why||'');nextBtn()}})}
else{max+=1;document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const ok=b.dataset.o===c.a;if(ok)score++;document.querySelectorAll('[data-o]').forEach(x=>{x.disabled=true;if(x.dataset.o===c.a)x.classList.add('ok')});if(!ok)b.classList.add('bad');
const f=$('fb');f.className='fb '+(ok?'ok':'bad');f.innerHTML=(ok?'<b>Correct ✓</b> ':'<b>Not quite: '+c.a+'.</b> ')+c.why;head();nextBtn()})}}
function end(){clearInterval(tm);tick();try{const k='cu_game_plays',a=JSON.parse(localStorage.getItem(k)||'[]');a.push({game:location.pathname.split('/').pop().replace('.html',''),score:score,max:max,at:Date.now()});localStorage.setItem(k,JSON.stringify(a.slice(-50)))}catch(e){}$('pg').style.width='100%';$('ref').hidden=false;const s=Math.floor((Date.now()-t0)/1000),p=score/max;
$('box').innerHTML='<div class="end"><div class="case">Your result</div><div class="big">'+score+' / '+max+'</div><p>'+(p===1?'Perfect! 🏆':p>=.7?'Well done 👏':'Review the summary below and try again 💪')+'</p><p class="sub">Time: '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+'</p><button class="next" style="display:block" id="again">Play again</button></div>';
$('again').onclick=()=>{$('ref').hidden=true;if(typeof ALL!=='undefined')G=ALL.slice().sort(()=>Math.random()-.5).slice(0,PICK);i=0;score=0;max=0;t0=Date.now();tm=setInterval(tick,1000);show()}}
tm=setInterval(tick,1000);show();</script></body></html>
