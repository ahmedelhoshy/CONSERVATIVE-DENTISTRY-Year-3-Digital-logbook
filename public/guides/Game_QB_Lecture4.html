<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lecture 4 · Dental Cariology (2) · Quick Quiz</title><style>:root{--bg:#F6F4EF;--card:#fff;--ink:#1C2B30;--mute:#5B6B70;--teal:#0E3F4A;--gold:#C8862A;--ok:#2E7D4F;--bad:#A23B2A;--line:#DCD8CE}
@media (prefers-color-scheme:dark){:root{--bg:#10191C;--card:#18252A;--ink:#E8EEEC;--mute:#9DB0B3;--teal:#7FC3CF;--gold:#E2B868;--ok:#6CC08F;--bad:#E07A68;--line:#2A3A40}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}h1{font:700 26px Georgia,serif;color:var(--teal);margin:0 0 4px}.sub{color:var(--mute);margin:0 0 16px}
.bar{display:flex;justify-content:space-between;font-size:14px;color:var(--mute);margin-bottom:8px}.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}.prog i{display:block;height:100%;background:var(--gold);transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}.case{font:600 13px system-ui;letter-spacing:1px;text-transform:uppercase;color:var(--gold)}
.q{margin:6px 0 14px;font-size:17px}.ar{direction:rtl;color:var(--mute);font-size:15px;margin:-6px 0 14px}
.opts{display:grid;gap:10px}button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:12px 14px;text-align:start;font-weight:600}
button:disabled{cursor:default;opacity:1}button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}button.used{opacity:.35}
.fb{margin-top:14px;padding:12px;border-radius:10px;display:none}.fb.ok{display:block;background:color-mix(in srgb,var(--ok) 14%,transparent)}.fb.bad{display:block;background:color-mix(in srgb,var(--bad) 14%,transparent)}
.next{margin-top:14px;width:100%;background:var(--teal);color:var(--bg);border:0;display:none;text-align:center}.end{text-align:center}.big{font:700 54px Georgia,serif;color:var(--teal)}
ol.seq{margin:0 0 12px;padding-inline-start:22px}ol.seq li{margin:4px 0}ol.seq li.bad{color:var(--bad)}ol.seq li.ok{color:var(--ok)}
.ref{margin-top:18px;font-size:14px;color:var(--mute)}.ref b{color:var(--ink)}</style></head><body><main>
<h1>Lecture 4 · Dental Cariology (2) · Quick Quiz</h1><p class="sub">8 random questions from the Histopathology & Diagnosis of Dental Caries question bank · new questions every play</p><div class="bar"><span id="count"></span><span id="time">⏱ 0:00</span></div><div class="prog"><i id="pg" style="width:0"></i></div>
<div class="card" id="box"></div><div class="ref" id="ref" hidden><b>Summary:</b> This quiz draws 8 of the 16 questions in the Lecture 4 question bank each time you play.</div></main><script>const ALL=[{"t": "Histopathology & Diagnosis of Dental Caries", "q": "Caries spreads in enamel along the direction of:", "o": ["Dentinal tubules", "Enamel rods (prisms)", "Incremental lines only", "The pulp chamber"], "a": "Enamel rods (prisms)", "why": "Answer: Enamel rods (prisms)."}, {"t": "Histopathology & Diagnosis of Dental Caries", "q": "In pit and fissure caries, the enamel lesion is cone-shaped with the:", "o": ["Base towards the surface", "Apex towards the surface and base towards the DEJ", "Apex towards the DEJ", "Same width throughout"], "a": "Apex towards the surface and base towards the DEJ", "why": "Answer: Apex towards the surface and base towards the DEJ."}, {"t": "Histopathology & Diagnosis of Dental Caries", "q": "In smooth-surface caries, the enamel lesion is cone-shaped with the:", "o": ["Base towards the tooth surface and apex towards the DEJ", "Base towards the DEJ", "Apex towards the surface", "Base towards the pulp"], "a": "Base towards the tooth surface and apex towards the DEJ", "why": "Answer: Base towards the tooth surface and apex towards the DEJ."}, {"t": "Histopathology & Diagnosis of Dental Caries", "q": "The zones of the early enamel lesion, from the surface inward, are:", "o": ["Surface zone, body of the lesion, dark zone, translucent zone", "Translucent zone, dark zone, body, surface zone", "Body, surface zone, dark zone, translucent zone", "Dark zone, translucent zone, surface zone, body"], "a": "Surface zone, body of the lesion, dark zone, translucent zone", "why": "Answer: Surface zone, body of the lesion, dark zone, translucent zone."}, {"t": "Histopathology & Diagnosis of Dental Caries", "q": "The advancing (deepest) front of the enamel lesion is the:", "o": ["Surface zone", "Body of the lesion", "Dark zone", "Translucent zone"], "a": "Translucent zone", "why": "Answer: Translucent zone."}, {"t": "Histopathology & Diagnosis of Dental Caries", "q": "The largest zone of the enamel lesion, with the greatest mineral loss, is the:", "o": ["Surface zone", "Body of the lesion", "Dark zone", "Translucent zone"], "a": "Body of the lesion", "why": "Answer: Body of the lesion."}, {"t": "Histopathology & Diagnosis of Dental Caries", "q": "Dentin formed inside the dentinal tubules (lining the tubule) is called:", "o": ["Intertubular dentin", "Peritubular (intratubular) dentin", "Primary dentin", "Mantle dentin"], "a": "Peritubular (intratubular) dentin", "why": "Answer: Peritubular (intratubular) dentin."}, {"t": "Histopathology & Diagnosis of Dental Caries", "q": "The zone of dentin caries where bacteria have invaded the tubules is the:", "o": ["Zone of penetration", "Sclerotic zone", "Normal affected dentin", "Translucent zone of enamel"], "a": "Zone of penetration", "why": "Answer: Zone of penetration."}, {"t": "Histopathology & Diagnosis of Dental Caries", "q": "The sclerotic zone of dentin caries represents:", "o": ["Bacterial invasion", "Tubules occluded by mineral deposition (a defensive reaction)", "Complete destruction", "Normal dentin"], "a": "Tubules occluded by mineral deposition (a defensive reaction)", "why": "Answer: Tubules occluded by mineral deposition (a defensive reaction)."}, {"t": "Histopathology & Diagnosis of Dental Caries", "q": "Infected dentin differs from affected dentin because infected dentin:", "o": ["Can remineralize", "Has irreversibly denatured collagen and is teeming with bacteria", "Does not stain with caries-detector dye", "Keeps collagen cross-linking"], "a": "Has irreversibly denatured collagen and is teeming with bacteria", "why": "Answer: Has irreversibly denatured collagen and is teeming with bacteria."}, {"t": "Histopathology & Diagnosis of Dental Caries", "q": "Which dentin should be preserved because it can remineralize?", "o": ["Infected dentin", "Affected dentin", "Necrotic dentin", "Dead tracts"], "a": "Affected dentin", "why": "Answer: Affected dentin."}, {"t": "Histopathology & Diagnosis of Dental Caries", "q": "Caries-detector dye (1% acid red in propylene glycol) stains:", "o": ["Affected dentin only", "Infected dentin with irreversibly denatured collagen only", "Normal dentin", "Sound enamel"], "a": "Infected dentin with irreversibly denatured collagen only", "why": "Answer: Infected dentin with irreversibly denatured collagen only."}, {"t": "Histopathology & Diagnosis of Dental Caries", "q": "Conventional methods of caries diagnosis include:", "o": ["Visual, tactile and radiographic examination", "Laser fluorescence only", "Pulp vitality testing only", "Transillumination only"], "a": "Visual, tactile and radiographic examination", "why": "Answer: Visual, tactile and radiographic examination."}, {"t": "Histopathology & Diagnosis of Dental Caries", "q": "Signs of caries on visual examination include:", "o": ["Change in surface colour and texture, roughness, discontinuity and cavitation", "Tooth mobility", "Gingival recession only", "Pain on percussion"], "a": "Change in surface colour and texture, roughness, discontinuity and cavitation", "why": "Answer: Change in surface colour and texture, roughness, discontinuity and cavitation."}, {"t": "Histopathology & Diagnosis of Dental Caries", "q": "Compared with active caries, arrested caries is usually:", "o": ["Light coloured, soft and moist", "Dark brown, hard and shiny", "Chalky and rough", "Always cavitated and painful"], "a": "Dark brown, hard and shiny", "why": "Answer: Dark brown, hard and shiny."}, {"t": "Histopathology & Diagnosis of Dental Caries", "q": "A radiolucency at the cervical area of a tooth that disappears on another film of the same tooth is most likely:", "o": ["Recurrent caries", "Cervical burnout", "Occlusal caries", "Root caries"], "a": "Cervical burnout", "why": "Answer: Cervical burnout."}];const PICK=8;let G=ALL.slice().sort(()=>Math.random()-.5).slice(0,PICK);
const $=(id)=>document.getElementById(id);let i=0,score=0,max=0,t0=Date.now(),tm;
const sh=(a)=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
function tick(){const s=Math.floor((Date.now()-t0)/1000);$('time').textContent='⏱ '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function head(){$('count').textContent='Round '+(i+1)+' of '+G.length+' · score '+score;$('pg').style.width=(i/G.length*100)+'%'}
function nextBtn(){$('nx').style.display='block';$('nx').onclick=()=>{i++;i<G.length?show():end()}}
function show(){const c=G[i];head();let h='<div class="case">Round '+(i+1)+(c.t?' · '+c.t:'')+'</div><p class="q">'+c.q+'</p>'+(c.ar?'<p class="ar">'+c.ar+'</p>':'');
if(c.order){h+='<ol class="seq" id="seq"></ol><div class="opts" id="op">'+sh(c.order.map((s,k)=>[s,k])).map(([s,k])=>'<button data-k="'+k+'">'+s+'</button>').join('')+'</div>'}
else h+='<div class="opts">'+(c.keep?c.o:sh(c.o)).map(o=>'<button data-o="'+o.replace(/"/g,'&quot;')+'">'+o+'</button>').join('')+'</div>';
h+='<div class="fb" id="fb"></div><button class="next" id="nx">'+(i<G.length-1?'Next →':'See my score')+'</button>';$('box').innerHTML=h;
if(c.order){max+=c.order.length;let picked=[];document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{if(b.disabled)return;b.disabled=true;b.classList.add('used');picked.push(+b.dataset.k);
const li=document.createElement('li');li.textContent=c.order[+b.dataset.k];$('seq').appendChild(li);
if(picked.length===c.order.length){let ok=0;[...$('seq').children].forEach((x,n)=>{const g=picked[n]===n;if(g)ok++;x.className=g?'ok':'bad'});score+=ok;head();
const f=$('fb');f.className='fb '+(ok===c.order.length?'ok':'bad');f.innerHTML='<b>'+ok+' of '+c.order.length+' in the right place.</b> Correct order:<ol class="seq">'+c.order.map(s=>'<li>'+s+'</li>').join('')+'</ol>'+(c.why||'');nextBtn()}})}
else{max+=1;document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const ok=b.dataset.o===c.a;if(ok)score++;document.querySelectorAll('[data-o]').forEach(x=>{x.disabled=true;if(x.dataset.o===c.a)x.classList.add('ok')});if(!ok)b.classList.add('bad');
const f=$('fb');f.className='fb '+(ok?'ok':'bad');f.innerHTML=(ok?'<b>Correct ✓</b> ':'<b>Not quite: '+c.a+'.</b> ')+c.why;head();nextBtn()})}}
function end(){clearInterval(tm);tick();try{const k='cu_game_plays',a=JSON.parse(localStorage.getItem(k)||'[]');a.push({game:location.pathname.split('/').pop().replace('.html',''),score:score,max:max,at:Date.now()});localStorage.setItem(k,JSON.stringify(a.slice(-50)))}catch(e){}$('pg').style.width='100%';$('ref').hidden=false;const s=Math.floor((Date.now()-t0)/1000),p=score/max;
$('box').innerHTML='<div class="end"><div class="case">Your result</div><div class="big">'+score+' / '+max+'</div><p>'+(p===1?'Perfect! 🏆':p>=.7?'Well done 👏':'Review the summary below and try again 💪')+'</p><p class="sub">Time: '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+'</p><button class="next" style="display:block" id="again">Play again</button></div>';
$('again').onclick=()=>{$('ref').hidden=true;if(typeof ALL!=='undefined')G=ALL.slice().sort(()=>Math.random()-.5).slice(0,PICK);i=0;score=0;max=0;t0=Date.now();tm=setInterval(tick,1000);show()}}
tm=setInterval(tick,1000);show();</script></body></html>
