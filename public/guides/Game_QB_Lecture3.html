<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lecture 3 · Dental Cariology (1) · Quick Quiz</title><style>:root{--bg:#F6F4EF;--card:#fff;--ink:#1C2B30;--mute:#5B6B70;--teal:#0E3F4A;--gold:#C8862A;--ok:#2E7D4F;--bad:#A23B2A;--line:#DCD8CE}
@media (prefers-color-scheme:dark){:root{--bg:#10191C;--card:#18252A;--ink:#E8EEEC;--mute:#9DB0B3;--teal:#7FC3CF;--gold:#E2B868;--ok:#6CC08F;--bad:#E07A68;--line:#2A3A40}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}h1{font:700 26px Georgia,serif;color:var(--teal);margin:0 0 4px}.sub{color:var(--mute);margin:0 0 16px}
.bar{display:flex;justify-content:space-between;font-size:14px;color:var(--mute);margin-bottom:8px}.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}.prog i{display:block;height:100%;background:var(--gold);transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}.case{font:600 13px system-ui;letter-spacing:1px;text-transform:uppercase;color:var(--gold)}
.q{margin:6px 0 14px;font-size:17px}.ar{direction:rtl;color:var(--mute);font-size:15px;margin:-6px 0 14px}
.opts{display:grid;gap:10px}button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:12px 14px;text-align:start;font-weight:600}
button:disabled{cursor:default;opacity:1}button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}button.used{opacity:.35}
.fb{margin-top:14px;padding:12px;border-radius:10px;display:none}.fb.ok{display:block;background:color-mix(in srgb,var(--ok) 14%,transparent)}.fb.bad{display:block;background:color-mix(in srgb,var(--bad) 14%,transparent)}
.next{margin-top:14px;width:100%;background:var(--teal);color:var(--bg);border:0;display:none;text-align:center}.end{text-align:center}.big{font:700 54px Georgia,serif;color:var(--teal)}
ol.seq{margin:0 0 12px;padding-inline-start:22px}ol.seq li{margin:4px 0}ol.seq li.bad{color:var(--bad)}ol.seq li.ok{color:var(--ok)}
.ref{margin-top:18px;font-size:14px;color:var(--mute)}.ref b{color:var(--ink)}</style></head><body><main>
<h1>Lecture 3 · Dental Cariology (1) · Quick Quiz</h1><p class="sub">8 random questions from the Classification of Dental Caries question bank · new questions every play</p><div class="bar"><span id="count"></span><span id="time">⏱ 0:00</span></div><div class="prog"><i id="pg" style="width:0"></i></div>
<div class="card" id="box"></div><div class="ref" id="ref" hidden><b>Summary:</b> This quiz draws 8 of the 16 questions in the Lecture 3 question bank each time you play.</div></main><script>const ALL=[{"t": "Classification of Dental Caries", "q": "According to anatomical site, caries is classified into:", "o": ["Pit & fissure, smooth surface and root caries", "Primary, secondary and residual caries", "Acute, chronic and rampant caries", "Active and arrested caries"], "a": "Pit & fissure, smooth surface and root caries", "why": "Answer: Pit & fissure, smooth surface and root caries."}, {"t": "Classification of Dental Caries", "q": "Smooth-surface caries includes caries on:", "o": ["Interproximal and cervical surfaces", "Occlusal pits and fissures only", "Cusp tips only", "Lingual pits of incisors"], "a": "Interproximal and cervical surfaces", "why": "Answer: Interproximal and cervical surfaces."}, {"t": "Classification of Dental Caries", "q": "Caries that develops at the margin of an existing restoration is:", "o": ["Primary caries", "Secondary (recurrent) caries", "Residual caries", "Rampant caries"], "a": "Secondary (recurrent) caries", "why": "Answer: Secondary (recurrent) caries."}, {"t": "Classification of Dental Caries", "q": "Carious tissue left behind under a restoration is called:", "o": ["Recurrent caries", "Residual caries", "Arrested caries", "Incipient caries"], "a": "Residual caries", "why": "Answer: Residual caries."}, {"t": "Classification of Dental Caries", "q": "Caries occurring on a previously intact tooth surface is:", "o": ["Primary caries", "Secondary caries", "Residual caries", "Recurrent caries"], "a": "Primary caries", "why": "Answer: Primary caries."}, {"t": "Classification of Dental Caries", "q": "According to severity, a lesion limited to demineralization without cavitation is:", "o": ["Initial (incipient) caries", "Moderate caries", "Deep caries", "Deep complicated caries"], "a": "Initial (incipient) caries", "why": "Answer: Initial (incipient) caries."}, {"t": "Classification of Dental Caries", "q": "Caries in dentin close to the pulp, without pulp involvement, is:", "o": ["Superficial caries", "Moderate caries", "Deep caries", "Deep complicated caries"], "a": "Deep caries", "why": "Answer: Deep caries."}, {"t": "Classification of Dental Caries", "q": "Deep complicated caries means caries with:", "o": ["Enamel involvement only", "Dentin involvement only", "Pulp involvement", "Root surface involvement"], "a": "Pulp involvement", "why": "Answer: Pulp involvement."}, {"t": "Classification of Dental Caries", "q": "According to progression, caries is classified into:", "o": ["Acute, chronic and rampant", "Active and arrested", "Primary and secondary", "Pit & fissure and smooth surface"], "a": "Acute, chronic and rampant", "why": "Answer: Acute, chronic and rampant."}, {"t": "Classification of Dental Caries", "q": "According to activity of the lesion, caries is classified into:", "o": ["Acute and chronic", "Active and arrested", "Primary and residual", "Initial and deep"], "a": "Active and arrested", "why": "Answer: Active and arrested."}, {"t": "Classification of Dental Caries", "q": "G.V. Black Class I includes cavities in:", "o": ["Proximal surfaces of premolars and molars", "Pits and fissures: occlusal of premolars and molars, occlusal two-thirds of buccal/lingual of molars, lingual of incisors", "Gingival third of labial and lingual surfaces", "Proximal surfaces of incisors involving the incisal angle"], "a": "Pits and fissures: occlusal of premolars and molars, occlusal two-thirds of buccal/lingual of molars, lingual of incisors", "why": "Answer: Pits and fissures: occlusal of premolars and molars, occlusal two-thirds of buccal/lingual of molars, lingual of incisors."}, {"t": "Classification of Dental Caries", "q": "Class II cavities are found in:", "o": ["Proximal surfaces of premolars (bicuspids) and molars", "Proximal surfaces of incisors and canines", "Gingival third of all teeth", "Cusp tips of posterior teeth"], "a": "Proximal surfaces of premolars (bicuspids) and molars", "why": "Answer: Proximal surfaces of premolars (bicuspids) and molars."}, {"t": "Classification of Dental Caries", "q": "Class III cavities are in the proximal surfaces of incisors and canines:", "o": ["Involving the incisal angle", "Not involving the incisal angle", "Involving the gingival third only", "Of posterior teeth only"], "a": "Not involving the incisal angle", "why": "Answer: Not involving the incisal angle."}, {"t": "Classification of Dental Caries", "q": "A proximal cavity in an upper central incisor that involves the incisal angle is:", "o": ["Class II", "Class III", "Class IV", "Class V"], "a": "Class IV", "why": "Answer: Class IV."}, {"t": "Classification of Dental Caries", "q": "Class V cavities are located in the:", "o": ["Gingival third of labial, buccal and lingual surfaces of all teeth (not pit and fissure)", "Occlusal surfaces of molars", "Incisal edges of anterior teeth", "Proximal surfaces of molars"], "a": "Gingival third of labial, buccal and lingual surfaces of all teeth (not pit and fissure)", "why": "Answer: Gingival third of labial, buccal and lingual surfaces of all teeth (not pit and fissure)."}, {"t": "Classification of Dental Caries", "q": "Class VI cavities (Simon's addition) are found on:", "o": ["Incisal edges of anterior teeth or cusp tips of posterior teeth", "Lingual pits of incisors", "Root surfaces", "Proximal surfaces of canines"], "a": "Incisal edges of anterior teeth or cusp tips of posterior teeth", "why": "Answer: Incisal edges of anterior teeth or cusp tips of posterior teeth."}];const PICK=8;let G=ALL.slice().sort(()=>Math.random()-.5).slice(0,PICK);
const $=(id)=>document.getElementById(id);let i=0,score=0,max=0,t0=Date.now(),tm;
const sh=(a)=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
function tick(){const s=Math.floor((Date.now()-t0)/1000);$('time').textContent='⏱ '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function head(){$('count').textContent='Round '+(i+1)+' of '+G.length+' · score '+score;$('pg').style.width=(i/G.length*100)+'%'}
function nextBtn(){$('nx').style.display='block';$('nx').onclick=()=>{i++;i<G.length?show():end()}}
function show(){const c=G[i];head();let h='<div class="case">Round '+(i+1)+(c.t?' · '+c.t:'')+'</div><p class="q">'+c.q+'</p>'+(c.ar?'<p class="ar">'+c.ar+'</p>':'');
if(c.order){h+='<ol class="seq" id="seq"></ol><div class="opts" id="op">'+sh(c.order.map((s,k)=>[s,k])).map(([s,k])=>'<button data-k="'+k+'">'+s+'</button>').join('')+'</div>'}
else h+='<div class="opts">'+(c.keep?c.o:sh(c.o)).map(o=>'<button data-o="'+o.replace(/"/g,'&quot;')+'">'+o+'</button>').join('')+'</div>';
h+='<div class="fb" id="fb"></div><button class="next" id="nx">'+(i<G.length-1?'Next →':'See my score')+'</button>';$('box').innerHTML=h;
if(c.order){max+=c.order.length;let picked=[];document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{if(b.disabled)return;b.disabled=true;b.classList.add('used');picked.push(+b.dataset.k);
const li=document.createElement('li');li.textContent=c.order[+b.dataset.k];$('seq').appendChild(li);
if(picked.length===c.order.length){let ok=0;[...$('seq').children].forEach((x,n)=>{const g=picked[n]===n;if(g)ok++;x.className=g?'ok':'bad'});score+=ok;head();
const f=$('fb');f.className='fb '+(ok===c.order.length?'ok':'bad');f.innerHTML='<b>'+ok+' of '+c.order.length+' in the right place.</b> Correct order:<ol class="seq">'+c.order.map(s=>'<li>'+s+'</li>').join('')+'</ol>'+(c.why||'');nextBtn()}})}
else{max+=1;document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const ok=b.dataset.o===c.a;if(ok)score++;document.querySelectorAll('[data-o]').forEach(x=>{x.disabled=true;if(x.dataset.o===c.a)x.classList.add('ok')});if(!ok)b.classList.add('bad');
const f=$('fb');f.className='fb '+(ok?'ok':'bad');f.innerHTML=(ok?'<b>Correct ✓</b> ':'<b>Not quite: '+c.a+'.</b> ')+c.why;head();nextBtn()})}}
function end(){clearInterval(tm);tick();try{const k='cu_game_plays',a=JSON.parse(localStorage.getItem(k)||'[]');a.push({game:location.pathname.split('/').pop().replace('.html',''),score:score,max:max,at:Date.now()});localStorage.setItem(k,JSON.stringify(a.slice(-50)))}catch(e){}$('pg').style.width='100%';$('ref').hidden=false;const s=Math.floor((Date.now()-t0)/1000),p=score/max;
$('box').innerHTML='<div class="end"><div class="case">Your result</div><div class="big">'+score+' / '+max+'</div><p>'+(p===1?'Perfect! 🏆':p>=.7?'Well done 👏':'Review the summary below and try again 💪')+'</p><p class="sub">Time: '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+'</p><button class="next" style="display:block" id="again">Play again</button></div>';
$('again').onclick=()=>{$('ref').hidden=true;if(typeof ALL!=='undefined')G=ALL.slice().sort(()=>Math.random()-.5).slice(0,PICK);i=0;score=0;max=0;t0=Date.now();tm=setInterval(tick,1000);show()}}
tm=setInterval(tick,1000);show();</script></body></html>
