name: Backup (encrypted)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 4'   # every Thursday 21:00 Cairo (before the weekend)
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      FB_PROJECT_ID: ${{ vars.FB_PROJECT_ID || 'digitallogbook-dfc3e' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: functions/package-lock.json }
      - run: cd functions && npm ci
      - run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - name: Export all collections
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: cd functions && node backup.mjs "$RUNNER_TEMP/out.json"
      - name: Encrypt and store on the 'backups' branch (one file per run, history kept)
        run: |
          set -e
          cd "$RUNNER_TEMP"
          STAMP=$(TZ=Africa/Cairo date +%Y-%m-%d_%H%M)
          gzip -9 out.json
          openssl rand -hex 32 > k.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -in out.json.gz -out "backup_$STAMP.enc" -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey "$GITHUB_WORKSPACE/functions/export_public.pem" -pkeyopt rsa_padding_mode:oaep -in k.txt -out "backup_$STAMP.key"
          git clone -q --depth 1 -b backups "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" store 2>/dev/null || { mkdir store && cd store && git init -q -b backups && cd ..; }
          cp "backup_$STAMP.enc" "backup_$STAMP.key" store/
          cd store && git add . && git -c user.name=logbook-bot -c user.email=logbook-bot@users.noreply.github.com commit -qm "Backup $STAMP" \
            && git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" backups
      - if: always()
        run: rm -f "$RUNNER_TEMP/sa.json" "$RUNNER_TEMP/out.json" "$RUNNER_TEMP/out.json.gz" "$RUNNER_TEMP/k.txt"
