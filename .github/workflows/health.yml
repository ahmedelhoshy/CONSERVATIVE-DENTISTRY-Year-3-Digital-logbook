name: Health check (counts only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['functions/health.mjs', '.github/workflows/health.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      FB_PROJECT_ID: ${{ vars.FB_PROJECT_ID || 'digitallogbook-dfc3e' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: functions/package-lock.json }
      - run: cd functions && npm ci
      - run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - name: Check live data
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-lite-latest' }}
        run: cd functions && node health.mjs
      - if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
