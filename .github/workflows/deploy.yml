name: Deploy logbook
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FB_PROJECT_ID: ${{ vars.FB_PROJECT_ID || 'digitallogbook-dfc3e' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Build web app
        run: npm run build
      - name: Prepare functions
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          node scripts/sync-shared.mjs
          cd functions && npm ci
          {
            echo "GEMINI_API_KEY=${GEMINI_API_KEY}"
            echo "SMTP_PASS=${SMTP_PASS}"
            echo "SMTP_USER=${{ vars.SMTP_USER }}"
            echo "SMTP_HOST=${{ vars.SMTP_HOST || 'smtp.gmail.com' }}"
            echo "SITE_URL=${{ vars.SITE_URL || 'https://digitallogbook-dfc3e.web.app' }}"
            echo "GEMINI_MODEL=${{ vars.GEMINI_MODEL || 'gemini-flash-lite-latest' }}"
          } > .env
      - name: Service account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - name: Deploy website, database rules and storage rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx -y firebase-tools@13 deploy --project "$FB_PROJECT_ID" --only hosting,firestore,storage --force --non-interactive
      - name: First-time setup (director account, default settings)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
          OWNER_NAME: ${{ vars.OWNER_NAME }}
        run: cd functions && node bootstrap.mjs
      - name: Deploy AI, reports and scheduled jobs (Cloud Functions)
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          set +e
          npx -y firebase-tools@13 deploy --project "$FB_PROJECT_ID" --only functions --force --non-interactive > fn.log 2>&1
          rc=$?
          cat fn.log
          sed 's/\x1b\[[0-9;]*m//g' fn.log | grep -iE "error|failed|denied|permission|invoker|warn|⚠" | grep -viE "node.js 20|deprecat|outdated|breaking changes" | tail -20 | while IFS= read -r l; do echo "::warning title=Functions deploy::$l"; done
          exit $rc
      - if: always()
        run: rm -f "$RUNNER_TEMP/sa.json" functions/.env
