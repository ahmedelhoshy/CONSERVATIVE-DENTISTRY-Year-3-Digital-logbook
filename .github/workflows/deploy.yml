name: Deploy logbook
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FB_PROJECT_ID: ${{ vars.FB_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Build web app
        run: npm run build
        env:
          VITE_FB_API_KEY: ${{ vars.FB_API_KEY }}
          VITE_FB_AUTH_DOMAIN: ${{ vars.FB_AUTH_DOMAIN }}
          VITE_FB_PROJECT_ID: ${{ vars.FB_PROJECT_ID }}
          VITE_FB_STORAGE_BUCKET: ${{ vars.FB_STORAGE_BUCKET }}
          VITE_FB_SENDER_ID: ${{ vars.FB_SENDER_ID }}
          VITE_FB_APP_ID: ${{ vars.FB_APP_ID }}
      - name: Prepare functions
        run: |
          node scripts/sync-shared.mjs
          cd functions && npm ci
          printf "SMTP_USER=%s\nSITE_URL=%s\nGEMINI_MODEL=%s\n" "${{ vars.SMTP_USER }}" "${{ vars.SITE_URL }}" "${{ vars.GEMINI_MODEL || 'gemini-flash-lite-latest' }}" > .env
      - name: Service account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - name: Store AI and email secrets
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          printf "%s" "$GEMINI_API_KEY" | npx -y firebase-tools@13 functions:secrets:set GEMINI_API_KEY --data-file=- --project "$FB_PROJECT_ID" --force --non-interactive || true
          printf "%s" "${SMTP_PASS:-unset}" | npx -y firebase-tools@13 functions:secrets:set SMTP_PASS --data-file=- --project "$FB_PROJECT_ID" --force --non-interactive || true
      - name: Deploy to Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx -y firebase-tools@13 deploy --project "$FB_PROJECT_ID" --only hosting,firestore,storage,functions --force --non-interactive
      - name: First-time setup (director account, default settings)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
          OWNER_NAME: ${{ vars.OWNER_NAME }}
        run: cd functions && node bootstrap.mjs
      - if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
