name: Evening report (build)
# Builds today's end-of-day report (about 17:30 Cairo) for the Course Director's team, encrypted, on the evening-report branch.
# Includes the "Action needed today" checklist (functions/report-lib.js actionHtml).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['functions/report_public_evening.pem', '.github/workflows/evening-report.yml']
permissions:
  contents: write
concurrency: evening-report
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FB_PROJECT_ID: ${{ vars.FB_PROJECT_ID || 'digitallogbook-dfc3e' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://digitallogbook-dfc3e.web.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: functions/package-lock.json }
      - run: node scripts/sync-shared.mjs && cd functions && npm ci
      - run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - name: Build report
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          REPORT_KIND: evening
        run: cd functions && node daily-report.mjs "$RUNNER_TEMP/report.json"
      - name: Encrypt and publish
        run: |
          set -e
          cd "$RUNNER_TEMP"
          openssl rand -hex 32 > k.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -in report.json -out report.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey "$GITHUB_WORKSPACE/functions/report_public_evening.pem" -pkeyopt rsa_padding_mode:oaep -in k.txt -out key.enc
          mkdir pub && cp report.enc key.enc pub/ && date -u +%FT%TZ > pub/built.txt
          cd pub && git init -q -b evening-report && git add . \
            && git -c user.name=logbook-bot -c user.email=logbook-bot@users.noreply.github.com commit -qm "Evening report" \
            && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" evening-report
      - if: always()
        run: rm -f "$RUNNER_TEMP/sa.json" "$RUNNER_TEMP/report.json" "$RUNNER_TEMP/k.txt"
